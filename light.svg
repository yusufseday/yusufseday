<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="610" viewBox="0 0 1180 610">
<defs>
  <linearGradient id="asciiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#1A1A1A">
      <animate attributeName="stop-color" values="#1A1A1A;#7C3AED;#000000;#1A1A1A" dur="9s" repeatCount="indefinite"/>
    </stop>
    <stop offset="100%" stop-color="#7C3AED">
      <animate attributeName="stop-color" values="#7C3AED;#000000;#1A1A1A;#7C3AED" dur="9s" repeatCount="indefinite"/>
    </stop>
  </linearGradient>
  <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#7C3AED"/>
    <stop offset="50%" stop-color="#22D3EE"/>
    <stop offset="100%" stop-color="#10B981"/>
  </linearGradient>
  <radialGradient id="bgGlow" cx="30%" cy="20%" r="80%">
    <stop offset="0%" stop-color="#FFFFFF"/>
    <stop offset="100%" stop-color="#EEF2FF"/>
  </radialGradient>
  <linearGradient id="scanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0"/>
    <stop offset="45%" stop-color="#0EA5E9" stop-opacity="0.05"/>
    <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.65"/>
    <stop offset="55%" stop-color="#0EA5E9" stop-opacity="0.05"/>
    <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
  </linearGradient>
  <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
    <rect width="4" height="1" fill="#0EA5E9" opacity="0.05"/>
  </pattern>
  <mask id="revealMask">
    <rect x="0" y="0" width="520" height="0" fill="white">
      <animate attributeName="height" from="0" to="560" dur="1.6s" begin="0.2s" fill="freeze"/>
    </rect>
  </mask>
